services:
  postgres:
    image: postgres:16
    container_name: personal-finance-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: finance_local_only
      POSTGRES_DB: personal_finance
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance -d personal_finance"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
